# =============================================================================
# MD-CMS Editor — Configuration
# =============================================================================
# MD-CMS Editor builds a page body, tab/accordion/callout code blocks for
# MD-CMS (https://github.com/kbenestad/mdcms) ready to paste into a page's
# Markdown source (or, for reusable callouts, into config.yml). It shares the
# bizdocs/basis chrome, but — unlike a PDF-producing app — its "output" is
# text, so there is no page-size, font, or logo configuration here; see
# CLAUDE.md for why those keys were dropped from this app's config.

# Organization
organization:                # leave blank to show the kBenestad wordmark
tagline:                      # subtitle shown below the org name (falls back to ui.subtitle)

# Branding — overrides the --accent token for this app
accent-colour: "#2f6fed"

# ── Localisation ──────────────────────────────────────────────────────────────
# Every user-facing string lives here, under each language's `ui:` block, and is
# looked up via S('key'). Use {token} placeholders for interpolation.
localisation:
  default-language: en

  languages:
    - code: en
      name: English
    - code: de
      name: Deutsch

  en:
    about:
      title: "About"
      button: "Close"
      content: |
        ### MD-CMS Editor
        Builds a page body, plus **tab**, **accordion**, and **callout**
        blocks for MD-CMS — fill in the fields, preview them, then copy the
        generated code straight into your page's Markdown source (or, for
        reusable callouts, into config.yml).

        Your draft is kept in this browser's local storage, so it survives a
        reload — nothing is uploaded anywhere.

        **MD-CMS:** [kbenestad/mdcms](https://github.com/kbenestad/mdcms)
        **Design system:** [kbenestad/bizdocs](https://github.com/kbenestad/bizdocs)
