# =============================================================================
# MD-CMS Editor — Configuration
# =============================================================================
# MD-CMS Editor builds tab and accordion code blocks for MD-CMS
# (https://github.com/kbenestad/mdcms) that can be pasted directly into a
# page's Markdown source. It shares the bizdocs/basis chrome, but — unlike a
# PDF-producing app — its "output" is a text snippet, so there is no page-size,
# font, or logo configuration here; see CLAUDE.md for why those keys were
# dropped from this app's config.

# Organization
organization:                # leave blank to show the kBenestad wordmark
tagline:                      # subtitle shown below the org name (falls back to ui.subtitle)

# Branding — overrides the --accent token for this app
accent-colour: "#2f6fed"

# ── Localisation ──────────────────────────────────────────────────────────────
# Every user-facing string lives here, under each language's `ui:` block, and is
# looked up via S('key'). Use {token} placeholders for interpolation.
localisation:
  default-language: en

  languages:
    - code: en
      name: English
    - code: de
      name: Deutsch

  en:
    about:
      title: "About"
      button: "Close"
      content: |
        ### MD-CMS Editor
        Builds **tab** and **accordion** blocks for MD-CMS — fill in items on
        the left, preview them on the right, then copy the generated
        ` ```mdcms ` code block straight into your page's Markdown source.

        Your draft is kept in this browser's local storage, so it survives a
        reload — nothing is uploaded anywhere.

        **MD-CMS:** [kbenestad/mdcms](https://github.com/kbenestad/mdcms)
        **Design system:** [kbenestad/bizdocs](https://github.com/kbenestad/bizdocs)
    ui:
      subtitle: "Tab & accordion block generator for MD-CMS"

      blocktype-tab: "Tabs"
      blocktype-accordion: "Accordion"

      variant-label: "Style"
      variant-underline: "Underline"
      variant-filled: "Filled"

      items-title: "Items"
      item-label: "Item {n}"
      field-title: "Title"
      ph-title-tab: "e.g. Install"
      ph-title-accordion: "e.g. What is MD-CMS?"
      field-content: "Content (Markdown)"
      ph-content: "Full Markdown — headings, lists, code fences, links…"
      field-title-style: "Title style"
      title-style-none: "None (default)"
      title-style-h: "Heading {n}"
      field-default-tab: "Active on load"
      field-default-accordion: "Open on load"
      add-item: "Add item"
      remove-item: "Remove item"
      move-up: "Move up"
      move-down: "Move down"
      empty-items: "No items yet — add one to get started."

      preview-title: "Preview"
      preview-note: "Interaction only — colours and spacing follow your site's own mdcms theme, not this editor."

      output-title: "Generated code"
      output-hint: "Paste this block directly into your MD-CMS page."
      output-empty: "Add at least one item with a title and content to generate code."
      warn-incomplete: "Give every item a title and content before copying."

      download-snippet: "Download .md"
      copy: "Copy to clipboard"
      copied: "Copied!"

  de:
    about:
      title: "Über"
      button: "Schließen"
      content: |
        ### MD-CMS Editor
        Erstellt **Tab**- und **Akkordeon**-Blöcke für MD-CMS — Elemente links
        ausfüllen, rechts prüfen und den erzeugten ` ```mdcms `-Codeblock direkt
        in den Markdown-Quelltext der Seite einfügen.

        Der Entwurf wird im lokalen Speicher des Browsers abgelegt und bleibt
        so auch nach einem Neuladen erhalten — es wird nichts hochgeladen.

        **MD-CMS:** [kbenestad/mdcms](https://github.com/kbenestad/mdcms)
        **Design-System:** [kbenestad/bizdocs](https://github.com/kbenestad/bizdocs)
    ui:
      subtitle: "Tab- und Akkordeon-Blockgenerator für MD-CMS"

      blocktype-tab: "Tabs"
      blocktype-accordion: "Akkordeon"

      variant-label: "Stil"
      variant-underline: "Unterstrichen"
      variant-filled: "Gefüllt"

      items-title: "Elemente"
      item-label: "Element {n}"
      field-title: "Titel"
      ph-title-tab: "z. B. Installation"
      ph-title-accordion: "z. B. Was ist MD-CMS?"
      field-content: "Inhalt (Markdown)"
      ph-content: "Vollständiges Markdown — Überschriften, Listen, Codeblöcke, Links…"
      field-title-style: "Titelstil"
      title-style-none: "Keiner (Standard)"
      title-style-h: "Überschrift {n}"
      field-default-tab: "Beim Laden aktiv"
      field-default-accordion: "Beim Laden geöffnet"
      add-item: "Element hinzufügen"
      remove-item: "Element entfernen"
      move-up: "Nach oben"
      move-down: "Nach unten"
      empty-items: "Noch keine Elemente — fügen Sie eins hinzu, um zu beginnen."

      preview-title: "Vorschau"
      preview-note: "Nur die Interaktion — Farben und Abstände folgen dem mdcms-Theme Ihrer Seite, nicht diesem Editor."

      output-title: "Generierter Code"
      output-hint: "Diesen Block direkt in Ihre MD-CMS-Seite einfügen."
      output-empty: "Fügen Sie mindestens ein Element mit Titel und Inhalt hinzu, um Code zu erzeugen."
      warn-incomplete: "Geben Sie jedem Element einen Titel und einen Inhalt, bevor Sie kopieren."

      download-snippet: "Als .md herunterladen"
      copy: "In die Zwischenablage kopieren"
      copied: "Kopiert!"
