<!DOCTYPE html>
<!--
  ════════════════════════════════════════════════════════════════════════════
  MD-CMS Editor — a standalone kbenestad app (shares the bizdocs/basis look).

  Builds a page body, `tab`/`accordion`/`callout` code blocks for MD-CMS
  (github.com/kbenestad/mdcms) ready to paste into a page's Markdown source.
  Built from the `basis` template — see ./README.md and ./CLAUDE.md for the
  template itself, ./DESIGN.md for the shared design system this app must stay
  pixel-identical to.

  Deliberate deviations from the `basis` default:
   - This app's "output" is text (Markdown/YAML), not a PDF, so pdf-lib is NOT
     loaded (see the CDN block below) and each panel has its own action rows.
   - Item/page/callout content is edited with Toast UI Editor (WYSIWYG, pinned
     3.2.2) instead of a plain kb-textarea. A rich editor instance carries
     state (undo history, cursor, mode) that must not be thrown away on every
     unrelated click, so rows are NOT rebuilt on every state change the way
     the rest of the family's forms are — see "Item row lifecycle" below.
  Every other chrome convention (head order, kb-* components, toolbar/header/
  footer assembly) is unchanged.

  Kinds (the switcher's tabs, in order): page, tab, accordion, callout. `tab`
  and `accordion` share BLOCK_TYPES (an items list + a variant). `callout` has
  two modes — inline (title/icon/body → one `​```mdcms callout-*​``` block) and
  reusable (a config.yml `callouts:` message, referenced from pages by key) —
  see the "Callout" section. `page` is a single Markdown body (frontmatter is
  intentionally out of scope for now — see docs/roadmap.md).

  Item row lifecycle: rows (tab/accordion items, callout reusable entries) are
  mounted once and patched in place:
   - typing (title/code inputs, WYSIWYG content) mutates state directly and
     calls refreshDerived(), which only touches the Preview/Output bodies.
   - add/remove/reorder/fold operate directly on the DOM via a registry (see
     rowRegistry) — none of them call render().
   - render() (full rebuild, destroying and remounting every editor instance)
     only runs at boot and on language switch. Switching the callout mode, or
     a successful Import/Load-from-clipboard, rebuilds just that one section
     the same way (see refreshCalloutModeBody / replaceItems) — a "structural"
     change is allowed a local rebuild; a keystroke never is.

  Content sanitisation: pasting rich/formatted text into Toast UI Editor can
  introduce characters (non-breaking spaces, BOM, control characters) that
  js-yaml's dump() cannot represent in clean `content: |` block style, so it
  silently falls back to a double-quoted, escaped string instead — see
  sanitizeMarkdown() for the verified-by-testing list of exactly which
  characters trigger that fallback, and why only those are touched.
  ════════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<title>MD-CMS Editor</title>

<!-- Favicons / PWA. Placeholder icon — see docs/roadmap.md for a real set. -->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="assets/site.webmanifest">
<meta name="theme-color" content="#2f6fed">

<!-- Restore persisted theme BEFORE first paint (avoids a flash). Keep this. -->
<script>
  (function(){var t=localStorage.getItem('kb-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
</script>

<!-- CDN libraries: js-yaml (config + snippet YAML) and Toast UI Editor (WYSIWYG
     content editing, pinned so a version bump can't change behaviour under
     us). No pdf-lib — see the file-header note above. -->
<script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-all.min.js"></script>
<link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/toastui-editor.min.css">
<link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/theme/toastui-editor-dark.css">

<!-- Shared design + runtime — LOCAL copies (self-contained / standalone).
     Kept byte-identical to bizdocs assets/. app.js MUST load before the inline <script>. -->
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/ui.css">
<script src="assets/app.js"></script>

<!-- App-specific styles ONLY (the shared look lives in assets/*.css). Prefixed
     "mce-" (MD-CMS Editor) so it can never collide with mdcms's own "mdcms-"
     render classes or the shared "kb-" component classes. -->
<style>
/* ui.css's .kb-note sets `display: flex` unconditionally, which (being an
   author-origin rule) outranks the browser's default `[hidden] { display:
   none }` even at equal specificity — so `noteEl.hidden = true` alone never
   actually hides a kb-note. This one-line, additive override is the fix
   (adding the extra attribute selector makes it win on specificity too, so
   it holds regardless of stylesheet order) — not a fork of the shared rule. */
.kb-note[hidden] { display: none; }

/* Icons (see the "Icons" section of the inline script for which specific
   spots get one — everything else in the app stays text-only). .kb-btn svg
   is already sized by ui.css; these cover the other two contexts an icon
   appears in: a card title, and the callout Inline/Reusable mode buttons
   (plain kb-seg buttons, which have no icon layout of their own). */
.mce-icon { display: inline-flex; flex-shrink: 0; }
.mce-icon svg { display: block; }
.kb-card__title .mce-icon svg { width: 15px; height: 15px; }
.mce-mode-btn { display: inline-flex; align-items: center; gap: 6px; }
.mce-mode-btn .mce-icon svg { width: 14px; height: 14px; }

.mce-panel { padding-top: 18px; }

.mce-import-row { margin-bottom: 18px; }

/* Items card: variant switch row + fold-all control + repeatable item rows. */
.mce-variant-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.mce-variant-row .kb-seg { margin-left: auto; }

.mce-items-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.mce-foldall-btn {
  background: none; border: 0; cursor: pointer; color: var(--text-muted);
  font: 600 var(--fs-small)/1 var(--font-sans); text-decoration: underline;
  text-underline-offset: 2px; padding: 2px 0;
}
.mce-foldall-btn:hover { color: var(--text); }

.mce-item {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-2); padding: 14px 16px; margin-bottom: 12px;
}
.mce-item__head { display: flex; align-items: center; gap: 8px; }
.mce-item.is-collapsed .mce-item__head { margin-bottom: 0; }
.mce-item:not(.is-collapsed) .mce-item__head { margin-bottom: 10px; }
.mce-item__index { font-size: var(--fs-label); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--text-muted); flex-shrink: 0; }
.mce-item__summary { font-size: var(--fs-small); font-weight: 600; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.mce-item__move { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0; }
.mce-item__row { display: grid; grid-template-columns: 1fr 180px; gap: 12px 16px; margin-bottom: 12px; }

.mce-fold-btn {
  display: inline-grid; place-items: center; width: 28px; height: 28px;
  background: none; border: 0; color: var(--text-muted); cursor: pointer;
  border-radius: var(--radius-sm); flex-shrink: 0;
}
.mce-fold-btn:hover { color: var(--accent); background: var(--surface-3); }
.mce-fold-chevron { width: 16px; height: 16px; transition: transform .15s; }
.mce-fold-btn[aria-expanded="false"] .mce-fold-chevron { transform: rotate(-90deg); }

.mce-item.is-collapsed .mce-item__body { display: none; }

/* Frame around each mounted Toast UI Editor so it reads as part of the page. */
.mce-editor-frame { border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }

.mce-toggle { display: flex; align-items: center; gap: 8px; font-size: var(--fs-small); color: var(--text-soft); cursor: pointer; margin-top: 12px; }
.mce-toggle input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

.mce-add-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: 0; cursor: pointer; color: var(--accent);
  font: 600 var(--fs-input)/1 var(--font-sans); padding: 8px 2px;
}
.mce-add-btn:hover { color: var(--accent-hover); }

.mce-hint { font-size: var(--fs-small); color: var(--text-muted); margin-top: 10px; line-height: 1.6; }

/* Preview: dashed frame signals "not the real theme" without extra copy. */
.mce-preview-body { border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 16px 18px; }
.mce-preview-body :is(h1, h2, h3) { margin: 10px 0 4px; }
.mce-preview-body p { margin-bottom: 8px; }
.mce-preview-body ul { margin-left: 18px; margin-bottom: 8px; }
.mce-preview-body .kb-note { margin: 0; }
.mce-preview-body .kb-note b { display: block; margin-bottom: 4px; }

/* Generated code block */
.mce-code {
  background: var(--surface-3); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px 16px; font-family: var(--font-mono); font-size: var(--fs-small);
  line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  max-height: 420px; overflow-y: auto; margin: 0;
}
.mce-output-subhead { margin: 18px 0 8px; }
.mce-output-subhead:first-child { margin-top: 0; }

.mce-entries-title { margin: 4px 0 10px; }

@media (max-width: 600px) {
  .mce-item__row { grid-template-columns: 1fr; }
}

/* Version footer block (see CLAUDE.md → Footer). kb-footer itself has no
   spacer/right-hand slot in the shared ui.css, so both live here. */
.kb-footer .spacer { flex: 1; }
.mce-version { text-align: right; line-height: 1.4; }
.mce-version > * { display: block; }
</style>
</head>
<body>
<div id="app"><p class="kb-loading">Loading configuration…</p></div>

<script>
(async function () {
'use strict';
/* This script is wrapped in an IIFE, so its top-level functions are NOT
 * globals — they cannot collide with app.js. Helpers from app.js ($, el,
 * makeSizeControl, kbAbout, kbAlert, kbModal, lookupString, makeTabs, uid,
 * markdown, …) are visible in here. */

let CFG;          // parsed config.yml
let HELP;         // parsed help.yml (kept separate so it can be edited/reviewed
                  // independently of branding/UI strings — see help.yml's header)
let lang = 'en';  // active UI language

// Footer version metadata (see CLAUDE.md → Versioning / Footer). Bump these
// alongside VERSION.md on every push to main; `prUrl` should point at the PR
// that shipped this version (fall back to the commit view if it landed on
// main without one).
const APP_VERSION = {
  version: '0.2.0',
  commit: '05ce21c',
  prUrl: 'https://github.com/kbenestad/mdcmseditor/pull/2',
  date: '4 July 2026',
};

// ── i18n ───────────────────────────────────────────────────────────────────
function S(key, vars) {
  return lookupString(CFG['ui-strings'], key, lang, CFG['default-code'], vars);
}

function assertValidConfig(cfg) {
  if (!cfg || typeof cfg !== 'object' || !cfg.localisation) {
    throw new Error(
      'config.yml loaded but did not parse to a valid configuration. The server ' +
      'most likely returned an HTML page (a 404 or single-page-app fallback, or a ' +
      'stale cached page) instead of the YAML file. Confirm config.yml is deployed ' +
      'next to index.html and served as plain text (not rewritten to index.html).'
    );
  }
}

function normaliseConfig() {
  const loc = CFG && CFG.localisation;
  if (!loc) return;
  const { table, languages, defaultCode } = buildLangTable(loc);
  CFG['default-code'] = defaultCode;
  CFG.languages = CFG.languages || languages;
  CFG['ui-strings'] = table;
}

function applyLang(lc) {
  lang = lc;
  const loc = CFG.localisation || {};
  const a = (loc[lc] && loc[lc].about) || (loc[CFG['default-code']] && loc[CFG['default-code']].about) || {};
  CFG['about-title']   = a.title   || 'About';
  CFG['about-content'] = a.content || '';
  CFG['about-button']  = a.button  || 'Close';
  const h = (HELP && (HELP[lc] || HELP[CFG['default-code']])) || {};
  CFG['help-title']   = h.title   || 'Help';
  CFG['help-content'] = h.content || '';
  CFG['help-button']  = h.button  || 'Close';
}

async function loadHelpConfig() {
  HELP = await loadYamlConfig('help.yml', { requireLocalisation: false });
}

function showAboutModal() {
  return kbAbout({ title: CFG['about-title'], contentMD: CFG['about-content'], closeLabel: CFG['about-button'] });
}

function showHelpModal() {
  return kbAbout({ title: CFG['help-title'], contentMD: CFG['help-content'], closeLabel: CFG['help-button'] });
}

// ── Icons ────────────────────────────────────────────────────────────────────
// Only these specific spots get an icon (buttons/labels below); everything
// else in the app stays text-only by design. Source SVGs are Google Material
// Symbols (Outlined), fetched once at boot and kept as real files in
// assets/icons/ rather than inlined as JS string constants like KB_ICON/
// MCE_TITLE_ICON — there are enough of these that a real asset per icon (one
// each) is more maintainable than one large string table, and it's exactly
// what "assets/" is for. Each file already has fill="currentColor" baked in,
// so icons follow the button/card-title text colour (and therefore the
// active theme) once inlined into the DOM.
const ICON_NAMES = ['content_paste_go', 'upload', 'data_check', 'iframe', 'cycle', 'help', 'article', 'cards_stack', 'preview', 'code_blocks'];
let ICONS = {};

async function loadIcons() {
  const entries = await Promise.all(ICON_NAMES.map(async (name) => {
    try {
      const res = await fetch('assets/icons/' + name + '.svg');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return [name, await res.text()];
    } catch (e) {
      return [name, '']; // fail soft — render without that one icon rather than breaking boot
    }
  }));
  ICONS = Object.fromEntries(entries);
}

// A small inline SVG for one of the ICON_NAMES, or an empty (harmless) span
// if that icon failed to load. `aria-hidden` is already on the SVG itself.
function iconEl(name) {
  const span = el('span', { className: 'mce-icon' });
  span.innerHTML = ICONS[name] || '';
  return span;
}

// kb-card__title with a leading icon — every card title in this app goes
// through here so the icon/text/count layout stays consistent.
function cardTitle(text, iconName) {
  const t = el('div', { className: 'kb-card__title' });
  if (iconName) t.appendChild(iconEl(iconName));
  t.appendChild(el('span', null, text));
  return t;
}

// ── Content sanitisation ─────────────────────────────────────────────────────
// Verified against js-yaml 4.1.0 (see the PR that introduced this): dump()
// only refuses its clean `content: |` literal-block style — falling back to a
// double-quoted, backslash-escaped string — for a small, specific set of
// characters: U+00A0 (non-breaking space), U+FEFF (BOM), U+2028/U+2029 (line/
// paragraph separators), and C0 control characters (tab, NUL, etc). Every
// other "weird paste" character tried (curly quotes, em dash, zero-width
// space/joiner, other Unicode space variants, CJK ideographic space) does NOT
// break literal style and is left untouched — this is a targeted fix for the
// reported bug, not a general "clean up my text" pass.
function sanitizeMarkdown(md) {
  if (!md) return '';
  return String(md)
    .replace(/\r\n?/g, '\n')                                 // CRLF / lone CR -> LF
    .replace(/[\u2028\u2029]/g, '\n')                        // line/paragraph separator -> LF
    .replace(/\u00A0/g, ' ')                                  // non-breaking space -> regular space
    .replace(/\t/g, ' ')                                      // tab -> space (see note below)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFEFF]/g, ''); // strip remaining control chars + BOM
  // Tabs become a single space rather than being preserved: these fields are
  // prose/Markdown, not source code, and a tab surviving into a nested code
  // fence pasted here would be the rare exception, not the common case.
}

// ── Block-type registry (tab/accordion) ─────────────────────────────────────
// variants     — the tag-name suffixes MD-CMS accepts. The editor always
//                emits the explicit variant name, never the bare alias
//                (`tab`/`accordion`), so pasted output is unambiguous.
// exclusive    — true if only one item may carry the "default" flag at a time
//                (tabs: exactly one active tab). false if any number may.
// defaultValue — the YAML value written for the item(s) carrying the flag.
const BLOCK_TYPES = {
  tab: {
    variants: [
      { id: 'underline', tagName: 'tab-underline' },
      { id: 'filled',    tagName: 'tab-filled' },
    ],
    exclusive: true,
    defaultValue: 'selected',
    titlePlaceholderKey: 'ph-title-tab',
    defaultFieldKey: 'field-default-tab',
  },
  accordion: {
    variants: [
      { id: 'underline', tagName: 'accordion-underline' },
      { id: 'filled',    tagName: 'accordion-filled' },
    ],
    exclusive: false,
    defaultValue: 'open',
    titlePlaceholderKey: 'ph-title-accordion',
    defaultFieldKey: 'field-default-accordion',
  },
};
const TITLE_STYLE_LEVELS = ['', '#', '##', '###', '####', '#####', '######'];
const CALLOUT_TYPES = ['info', 'warning', 'success', 'error'];

function currentVariantDef(kind) {
  const cfg = BLOCK_TYPES[kind];
  return cfg.variants.find(v => v.id === state.variant[kind]) || cfg.variants[0];
}

function makeBlankItem() {
  return { id: uid(), title: '', content: '', isDefault: false, titleStyle: '', collapsed: false };
}

function seedItems(kind) {
  return kind === 'tab'
    ? [
        { id: uid(), title: 'Install', content: 'Install with `npm i mdcms` or `pnpm add mdcms`.', isDefault: true, titleStyle: '', collapsed: false },
        { id: uid(), title: 'Configure', content: 'Drop a `mdcms.config.yaml` next to your content folder.', isDefault: false, titleStyle: '', collapsed: false },
      ]
    : [
        { id: uid(), title: 'What is MD-CMS?', content: 'A single-file browser renderer: no build pipeline, no compilation, no server required.', isDefault: true, titleStyle: '', collapsed: false },
        { id: uid(), title: 'How do I install it?', content: 'Run `pip install mdcms`, or download a binary from the GitHub releases page.', isDefault: false, titleStyle: '', collapsed: false },
      ];
}

function makeBlankCalloutEntry() {
  return { id: uid(), code: '', title: '', text: '' };
}

// ── State + persistence ──────────────────────────────────────────────────────
let state = {
  page: { content: '' },
  variant: {},
  items: {},
  callout: {
    mode: 'inline',
    inline: { type: 'info', title: '', icon: '', content: '' },
    reusable: { key: '', type: 'info', entries: [] },
  },
};

// Per-kind DOM refs for chrome that lives OUTSIDE the item rows (count badge,
// empty-state note, the rows' host container, the fold-all button) — set once
// per panel build, read by add/remove/move/fold so those never need to
// re-query the DOM or rebuild the card. Per-row refs (including the Toast UI
// Editor instance) live in rowRegistry, keyed by row id. `page` and
// `calloutInline` hold exactly one entry each (key 'page' / 'inline') so they
// share the same destroy-all/theme-sync plumbing as the real per-row maps.
const cardRefs = { tab: {}, accordion: {}, page: {}, callout: {}, calloutEntries: {} };
const rowRegistry = { tab: new Map(), accordion: new Map(), page: new Map(), calloutInline: new Map(), calloutEntry: new Map() };

const DRAFT_KEY = 'mdcmseditor-draft';

function persistDraft() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      variant: state.variant, items: state.items, page: state.page, callout: state.callout,
    }));
  } catch (e) { /* storage unavailable/full — draft simply won't persist */ }
}

function loadDraft() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { saved = null; }

  const variant = { tab: 'underline', accordion: 'underline' };
  const items = { tab: seedItems('tab'), accordion: seedItems('accordion') };

  Object.keys(BLOCK_TYPES).forEach(kind => {
    if (saved && saved.variant && BLOCK_TYPES[kind].variants.some(v => v.id === saved.variant[kind])) {
      variant[kind] = saved.variant[kind];
    }
    if (saved && Array.isArray(saved.items && saved.items[kind]) && saved.items[kind].length) {
      items[kind] = saved.items[kind].map(it => ({
        id: (it && it.id) || uid(),
        title: (it && typeof it.title === 'string') ? sanitizeMarkdown(it.title) : '',
        content: (it && typeof it.content === 'string') ? sanitizeMarkdown(it.content) : '',
        isDefault: !!(it && it.isDefault),
        titleStyle: (it && TITLE_STYLE_LEVELS.includes(it.titleStyle)) ? it.titleStyle : '',
        collapsed: !!(it && it.collapsed),
      }));
    }
  });

  const page = { content: (saved && saved.page && typeof saved.page.content === 'string') ? sanitizeMarkdown(saved.page.content) : '' };

  const callout = {
    mode: 'inline',
    inline: { type: 'info', title: '', icon: '', content: '' },
    reusable: { key: '', type: 'info', entries: [] },
  };
  if (saved && saved.callout && typeof saved.callout === 'object') {
    if (saved.callout.mode === 'reusable') callout.mode = 'reusable';
    const si = saved.callout.inline;
    if (si && typeof si === 'object') {
      callout.inline = {
        type: CALLOUT_TYPES.includes(si.type) ? si.type : 'info',
        title: typeof si.title === 'string' ? sanitizeMarkdown(si.title) : '',
        icon: typeof si.icon === 'string' ? sanitizeMarkdown(si.icon) : '',
        content: typeof si.content === 'string' ? sanitizeMarkdown(si.content) : '',
      };
    }
    const sr = saved.callout.reusable;
    if (sr && typeof sr === 'object') {
      callout.reusable.key = typeof sr.key === 'string' ? sr.key : '';
      callout.reusable.type = CALLOUT_TYPES.includes(sr.type) ? sr.type : 'info';
      callout.reusable.entries = Array.isArray(sr.entries) ? sr.entries.map(e => ({
        id: (e && e.id) || uid(),
        code: (e && typeof e.code === 'string') ? e.code : '',
        title: (e && typeof e.title === 'string') ? sanitizeMarkdown(e.title) : '',
        text: (e && typeof e.text === 'string') ? sanitizeMarkdown(e.text) : '',
      })) : [];
    }
  }
  if (!callout.reusable.entries.length) callout.reusable.entries = [Object.assign(makeBlankCalloutEntry(), { code: 'en' })];

  return { variant, items, page, callout };
}

// ── YAML / snippet generation (tab/accordion) ────────────────────────────────
// A trailing newline (and only one) on each item's content matches how MD-CMS's
// own docs write these blocks and keeps js-yaml on the clean `content: |` block
// style rather than the `|-` (strip) variant.
function withSingleTrailingNewline(s) {
  return s ? s.replace(/\n+$/, '') + '\n' : '';
}

function buildYamlItems(kind) {
  const cfg = BLOCK_TYPES[kind];
  return state.items[kind].map(item => {
    const obj = { title: item.title || '' };
    if (item.isDefault) obj.default = cfg.defaultValue;
    obj.content = withSingleTrailingNewline(item.content);
    if (item.titleStyle) obj['title-style'] = item.titleStyle;
    return obj;
  });
}

// Builds the exact ```mdcms <tag>\n<yaml>``` block ready to paste into a page.
function buildSnippet(kind) {
  const tagName = currentVariantDef(kind).tagName;
  const yamlBody = jsyaml.dump({ items: buildYamlItems(kind) }, { lineWidth: -1 });
  return '```mdcms ' + tagName + '\n' + yamlBody + '```\n';
}

// ── Callout generation ────────────────────────────────────────────────────────
// Inline callouts are NOT YAML-bodied — MD-CMS's own parser treats the fence
// body as plain `key: value` header lines followed by a body of Markdown (see
// docs/reference-pages.md in kbenestad/mdcms: "the first non-matching line
// begins the body"). Crucially, that header-scan is a naive per-line regex
// with no way to escape a body line that itself happens to look like
// `key: value` (e.g. a body starting "Note: check this") — MD-CMS's own docs
// dodge this by always leaving one blank line between the header and the
// body, which is why we always emit one too, even with no title/icon set.
function buildCalloutInlineSnippet() {
  const c = state.callout.inline;
  const lines = ['```mdcms callout-' + c.type];
  if (c.title.trim()) lines.push('title: ' + c.title.trim());
  if (c.icon.trim()) lines.push('icon: ' + c.icon.trim());
  lines.push('');
  lines.push(sanitizeMarkdown(c.content || '').replace(/\n+$/, ''));
  lines.push('```');
  return lines.join('\n') + '\n';
}

function buildCalloutReusableFenceSnippet() {
  const r = state.callout.reusable;
  return '```mdcms callout-' + r.type + '\nmessage: ' + (r.key.trim() || '') + '\n```\n';
}

// The entry to paste under the `callouts:` key in config.yml — not a full
// config.yml redump, since we don't have the rest of the user's file.
function buildCalloutConfigYaml() {
  const r = state.callout.reusable;
  const key = r.key.trim() || 'message-key';
  const def = { type: r.type };
  r.entries.forEach(e => {
    const code = e.code.trim();
    if (!code) return;
    def[code] = { title: e.title || '', text: withSingleTrailingNewline(e.text) };
  });
  return jsyaml.dump({ [key]: def }, { lineWidth: -1 });
}

// ── Render ─────────────────────────────────────────────────────────────────
// Full rebuild — destroys every mounted Toast UI Editor instance first. Only
// called at boot and on language switch (see the file-header lifecycle note).
function render() {
  persistDraft();
  destroyAllEditors();
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = el('div', { className: 'kb-wrap' });

  wrap.appendChild(buildToolbar());
  wrap.appendChild(buildHeader());
  wrap.appendChild(buildSwitcher());
  wrap.appendChild(buildFooter());

  app.appendChild(wrap);
  updateThemeIcon();
}

function destroyAllEditors() {
  Object.keys(rowRegistry).forEach(kind => {
    rowRegistry[kind].forEach(entry => { try { entry.editor.destroy(); } catch (e) { /* already gone */ } });
    rowRegistry[kind].clear();
  });
}

// Rebuild only the Preview + Output card bodies for one kind, in place. Used
// by every keystroke/toggle handler so rows (and their live editors) are
// never touched.
function refreshDerived(kind) {
  const previewBody = document.getElementById('mce-preview-' + kind);
  if (previewBody) { previewBody.innerHTML = ''; previewBody.appendChild(buildPreviewBody(kind)); }
  const outputBody = document.getElementById('mce-output-' + kind);
  if (outputBody) { outputBody.innerHTML = ''; outputBody.appendChild(buildOutputBody(kind)); }
  persistDraft();
}

// Toast UI Editor has no reactive setTheme() — dark mode is a CSS class on
// each editor's own container. Sync it here whenever the app theme flips,
// rather than hooking toggleTheme() itself (shared app.js, must stay
// byte-identical to bizdocs).
new MutationObserver(() => {
  const dark = currentTheme() === 'dark';
  Object.keys(rowRegistry).forEach(kind => {
    rowRegistry[kind].forEach(entry => entry.editorHost.classList.toggle('toastui-editor-dark', dark));
  });
}).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// Toast UI Editor (vendored, not this app's code) can throw a benign
// "removeChild" NotFoundError from its own internal ResizeObserver-driven
// layout bookkeeping when an editor is destroyed shortly after its container
// was hidden/shown (our fold/unfold, or a language switch's full rebuild).
// Verified harmless: automated interaction tests (type/add/remove/reorder/
// fold, in every order that can trigger it) show state, output, and every
// other editor instance are unaffected either way. A magic delay before
// destroy() was tried and is not reliably long enough on top of being bad
// UX (remove should feel instant), so this narrowly-scoped filter — matched
// on both origin file and exact error type/message — is the more honest fix
// for a third-party timing quirk than either papering over it with a delay
// or leaving user-facing console noise for something that isn't a real bug.
window.addEventListener('error', (event) => {
  const fromToastUI = event.filename && event.filename.indexOf('toastui-editor') !== -1;
  const err = event.error;
  if (fromToastUI && err && err.name === 'NotFoundError' && /removeChild/.test(err.message)) {
    event.preventDefault();
  }
});

// Toolbar: language select · spacer · A−/A+ size · theme · about
function buildToolbar() {
  const toolbar = el('div', { className: 'kb-toolbar' });

  const langSel = el('select', { className: 'kb-select', 'aria-label': 'Language' });
  (CFG.languages || []).forEach(l => {
    const o = el('option', { value: l.code }, l.name || l.code);
    if (l.code === lang) o.selected = true;
    langSel.appendChild(o);
  });
  langSel.addEventListener('change', () => {
    applyLang(langSel.value);
    localStorage.setItem('mdcmseditor-lang', langSel.value);
    render();
  });

  const { seg: sizeSeg, label: szLabel } = makeSizeControl();
  toolbar.append(
    langSel,
    el('div', { className: 'spacer' }),
    sizeSeg, szLabel,
    makeThemeButton(),
    makeAboutButton(showAboutModal)
  );
  return toolbar;
}

// A visible, labelled button (not an icon-only kb-iconbtn like theme/about)
// since Help is meant to be the obviously-clickable one for a first-time,
// non-technical user — see showHelpModal() for its content.
function makeHelpButton() {
  const btn = el('button', { type: 'button', className: 'kb-btn kb-btn--ghost', onClick: showHelpModal });
  btn.append(iconEl('help'), document.createTextNode(S('help-label')));
  return btn;
}

// Header: brand wordmark (kBenestad mark + org/tagline) + right-aligned title.
const MCE_TITLE_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="8 6 3 12 8 18"/><polyline points="16 6 21 12 16 18"/></svg>';

// Extra semantic icons (success/error) beyond app.js's shared KB_ICON (which
// only has warn/info) — used by noteBox() and the callout preview.
const MCE_ICON = {
  success: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>',
  error: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
};

function buildHeader() {
  const header = el('header', { className: 'kb-header' });

  const brand = el('div', { className: 'kb-brand' });
  const tile = el('span', { className: 'logo' }); tile.innerHTML = KB_BRAND_SVG;
  const org = el('span', { className: 'org' });
  org.appendChild(document.createTextNode(CFG.organization || 'kbenestad/mdcmseditor'));
  const small = el('small'); small.textContent = CFG.tagline || S('subtitle');
  org.appendChild(small);
  brand.append(tile, org);

  const title = el('div', { className: 'kb-doctitle' });
  const h1 = el('h1');
  h1.innerHTML = MCE_TITLE_ICON;
  h1.appendChild(document.createTextNode('MD-CMS Editor'));
  title.appendChild(h1);

  header.append(brand, title);
  return header;
}

// Top-level switch between the four kinds. All panels are always fully built
// (see the file-header architecture note); makeTabs() just shows one. Page is
// first/default per the product decision to make whole-page editing the
// primary flow long-term (see docs/roadmap.md).
function buildSwitcher() {
  return makeTabs([
    { label: S('blocktype-page'), content: buildPagePanel() },
    { label: S('blocktype-tab'), content: buildKindPanel('tab') },
    { label: S('blocktype-accordion'), content: buildKindPanel('accordion') },
    { label: S('blocktype-callout'), content: buildCalloutPanel() },
  ]);
}

function field(label, input, extraClass) {
  const f = el('div', { className: 'kb-field' + (extraClass ? ' ' + extraClass : '') });
  f.append(el('span', { className: 'kb-label' }, label), input);
  return f;
}

function noteBox(variant, text) {
  const icons = { warning: KB_ICON.warn, info: KB_ICON.info, success: MCE_ICON.success, error: MCE_ICON.error };
  const box = el('div', { className: 'kb-note kb-note--' + variant });
  const icon = el('span'); icon.innerHTML = icons[variant] || KB_ICON.info;
  box.append(icon, el('div', null, text));
  return box;
}

function makeEditorHost() {
  return el('div', { className: 'mce-editor-frame' + (currentTheme() === 'dark' ? ' toastui-editor-dark' : '') });
}

// Shared Toast UI Editor options for every mounted instance: WYSIWYG by
// default (the mode-switch tab is NOT hidden, so anyone can still drop into
// raw Markdown — MD-CMS accepts full Markdown, we don't want to lock that
// escape hatch away), no usage tracking (this app promises nothing is
// uploaded anywhere — see About), and an image hook that asks for a URL/path
// instead of embedding a base64 blob (see the hook's own comment).
function mountEditor(editorHost, initialValue, height, placeholderKey, onChange) {
  const editor = new toastui.Editor({
    el: editorHost,
    height,
    initialEditType: 'wysiwyg',
    previewStyle: 'tab',
    initialValue: initialValue || '',
    placeholder: S(placeholderKey),
    usageStatistics: false,
    hooks: {
      // Without a hook, Toast UI embeds pasted/dropped images as base64 data
      // URIs directly in the Markdown, which would bloat the generated output
      // enormously and doesn't match how a real MD-CMS site references images
      // (a relative path into its own assets). Ask for that path instead.
      addImageBlobHook: (_blob, callback) => {
        const url = window.prompt(S('image-url-prompt'), '');
        if (url) callback(url, '');
      },
    },
  });
  editor.on('change', () => onChange(sanitizeMarkdown(editor.getMarkdown())));
  return editor;
}

// ── Import / clipboard / validate (shared by every panel) ───────────────────
function buildImportRow(kind) {
  const row = el('div', { className: 'kb-actions mce-import-row' });
  const fileInput = el('input', { type: 'file', accept: '.md,.markdown,text/markdown,text/plain' });
  fileInput.style.display = 'none';
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    importTextForKind(kind, await file.text());
  });
  const importBtn = el('button', { type: 'button', className: 'kb-btn kb-btn--ghost', onClick: () => fileInput.click() });
  importBtn.append(iconEl('upload'), document.createTextNode(S('import-md')));
  const clipboardBtn = el('button', { type: 'button', className: 'kb-btn kb-btn--ghost', onClick: () => importFromClipboard(kind) });
  clipboardBtn.append(iconEl('content_paste_go'), document.createTextNode(S('load-clipboard')));
  const validateBtn = el('button', { type: 'button', className: 'kb-btn kb-btn--ghost', onClick: () => runValidation(kind) });
  validateBtn.append(iconEl('data_check'), document.createTextNode(S('validate')));
  row.append(fileInput, importBtn, clipboardBtn, validateBtn, el('div', { className: 'spacer' }), makeHelpButton());
  return row;
}

async function importFromClipboard(kind) {
  try {
    const text = await navigator.clipboard.readText();
    importTextForKind(kind, text);
  } catch (e) {
    kbAlert({ title: S('import-error-title'), message: S('clipboard-read-error') });
  }
}

function importTextForKind(kind, rawText) {
  const text = sanitizeMarkdown(rawText);
  if (!text.trim()) { kbAlert({ title: S('import-error-title'), message: S('import-empty-text') }); return; }
  if (kind === 'page') return importPageText(text);
  if (kind === 'callout') return importCalloutText(text);
  return importItemsText(kind, text);
}

function importItemsText(kind, text) {
  const re = kind === 'tab'
    ? /```mdcms\s+(tab(?:-underline|-filled)?)\s*\n([\s\S]*?)\n```/
    : /```mdcms\s+(accordion(?:-underline|-filled)?)\s*\n([\s\S]*?)\n```/;
  const match = text.match(re);
  if (!match) {
    kbAlert({ title: S('import-error-title'), message: S(kind === 'tab' ? 'import-no-tab-block' : 'import-no-accordion-block') });
    return;
  }
  const tagName = match[1];
  const variant = tagName.endsWith('-filled') ? 'filled' : 'underline';
  let parsed;
  try { parsed = jsyaml.load(match[2]); } catch (e) {
    kbAlert({ title: S('import-error-title'), message: S('import-yaml-error', { error: e.message }) });
    return;
  }
  const cfg = BLOCK_TYPES[kind];
  const rawItems = (parsed && Array.isArray(parsed.items)) ? parsed.items : [];
  if (!rawItems.length) { kbAlert({ title: S('import-error-title'), message: S('import-empty-items') }); return; }
  const items = rawItems.map(it => ({
    id: uid(),
    title: sanitizeMarkdown(String((it && it.title) || '')),
    content: sanitizeMarkdown(String((it && it.content) || '')),
    isDefault: !!(it && it.default === cfg.defaultValue),
    titleStyle: (it && TITLE_STYLE_LEVELS.includes(it['title-style'])) ? it['title-style'] : '',
    collapsed: false,
  }));
  replaceItems(kind, variant, items);
}

// Destroys and remounts every row for one kind with new data — used by
// Import/Load-from-clipboard. A wholesale replace is a structural change like
// add/remove, so (per the file-header lifecycle note) a local rebuild here is
// fine; it just needs to be THIS kind's rebuild, not a full page render().
function replaceItems(kind, variant, items) {
  rowRegistry[kind].forEach(entry => { try { entry.editor.destroy(); } catch (e) { /* already gone */ } });
  rowRegistry[kind].clear();
  cardRefs[kind].itemsHost.innerHTML = '';
  state.variant[kind] = variant;
  state.items[kind] = items;
  const cfg = BLOCK_TYPES[kind];
  items.forEach(item => cardRefs[kind].itemsHost.appendChild(mountItemRow(kind, cfg, item)));
  (cardRefs[kind].variantButtons || []).forEach(({ id, btn }) => btn.classList.toggle('is-active', id === variant));
  syncRowChrome(kind);
  refreshDerived(kind);
}

function importPageText(text) {
  state.page.content = text;
  const entry = rowRegistry.page.get('page');
  if (entry) entry.editor.setMarkdown(text);
  refreshDerived('page');
}

// Recognises three shapes pasted/imported for the Callout panel: (1) an
// inline ```mdcms callout-*``` fence with a title/icon/body, (2) the same
// fence but with just `message: <key>` (a page-side reference — the actual
// title/text live in config.yml, not on the page, so only the key/type can
// be recovered), or (3) a raw YAML `callouts:`-style entry (with or without
// the wrapping `callouts:` key) — i.e. what this app's own "config.yml
// entry" output looks like, so round-tripping our own output back in works.
function importCalloutText(text) {
  const fenceMatch = text.match(/```mdcms\s+callout-(info|warning|success|error)\s*\n([\s\S]*?)\n```/);
  if (fenceMatch) {
    const type = fenceMatch[1];
    const lines = fenceMatch[2].split('\n');
    const options = {};
    let bodyStart = lines.length;
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^\s*([a-zA-Z-]+)\s*:\s*(.*)$/);
      if (m) { options[m[1].toLowerCase()] = m[2].trim(); } else { bodyStart = i; break; }
    }
    const bodyText = sanitizeMarkdown(lines.slice(bodyStart).join('\n').trim());
    if (options.message) {
      state.callout.mode = 'reusable';
      state.callout.reusable.key = options.message;
      state.callout.reusable.type = type;
      refreshCalloutModeBody();
      refreshDerived('callout');
      kbAlert({ title: S('import-title'), message: S('import-callout-message-only') });
    } else {
      state.callout.mode = 'inline';
      state.callout.inline = { type, title: sanitizeMarkdown(options.title || ''), icon: sanitizeMarkdown(options.icon || ''), content: bodyText };
      refreshCalloutModeBody();
      refreshDerived('callout');
    }
    return;
  }

  let parsed;
  try { parsed = jsyaml.load(text); } catch (e) {
    kbAlert({ title: S('import-error-title'), message: S('import-callout-unrecognized') });
    return;
  }
  let entryRoot = parsed;
  if (parsed && parsed.callouts && typeof parsed.callouts === 'object') entryRoot = parsed.callouts;
  const key = entryRoot && typeof entryRoot === 'object' ? Object.keys(entryRoot)[0] : null;
  if (!key) { kbAlert({ title: S('import-error-title'), message: S('import-callout-unrecognized') }); return; }
  const def = entryRoot[key] || {};
  const type = CALLOUT_TYPES.includes(def.type) ? def.type : 'info';
  const entries = Object.keys(def).filter(k => k !== 'type').map(code => ({
    id: uid(),
    code,
    title: sanitizeMarkdown(String((def[code] && def[code].title) || '')),
    text: sanitizeMarkdown(String((def[code] && def[code].text) || '')),
  }));
  state.callout.mode = 'reusable';
  state.callout.reusable.key = key;
  state.callout.reusable.type = type;
  state.callout.reusable.entries = entries.length ? entries : [makeBlankCalloutEntry()];
  refreshCalloutModeBody();
  refreshDerived('callout');
}

// ── Validation ────────────────────────────────────────────────────────────────
function runValidation(kind) {
  const issues = validateKind(kind);
  const body = el('div', { className: 'kb-modal__body' });
  if (!issues.length) body.appendChild(noteBox('success', S('validate-all-good')));
  else issues.forEach(issue => body.appendChild(noteBox(issue.level, issue.message)));
  kbModal({ title: S('validate-title'), bodyNode: body, buttons: [{ label: S('action-close'), value: true, variant: 'kb-btn--primary', autofocus: true }] });
}

function validateKind(kind) {
  if (kind === 'page') return validatePage();
  if (kind === 'callout') return validateCallout();
  return validateItems(kind);
}

function validateItems(kind) {
  const issues = [];
  const items = state.items[kind];
  if (!items.length) { issues.push({ level: 'error', message: S('validate-no-items') }); return issues; }
  items.forEach((it, i) => {
    if (!it.title.trim()) issues.push({ level: 'error', message: S('validate-missing-title', { n: i + 1 }) });
    if (!it.content.trim()) issues.push({ level: 'error', message: S('validate-missing-content', { n: i + 1 }) });
  });
  const titles = items.map(it => it.title.trim().toLowerCase()).filter(Boolean);
  if (titles.some((t, i) => titles.indexOf(t) !== i)) issues.push({ level: 'warning', message: S('validate-duplicate-titles') });
  try {
    const snippet = buildSnippet(kind);
    jsyaml.load(snippet.slice(snippet.indexOf('\n') + 1, snippet.lastIndexOf('```')));
  } catch (e) {
    issues.push({ level: 'error', message: S('validate-yaml-error', { error: e.message }) });
  }
  return issues;
}

function validatePage() {
  const issues = [];
  const content = state.page.content || '';
  if (!content.trim()) { issues.push({ level: 'error', message: S('validate-page-empty') }); return issues; }
  if (((content.match(/```/g) || []).length) % 2 !== 0) issues.push({ level: 'warning', message: S('validate-unbalanced-fences') });
  return issues;
}

function validateCallout() {
  const issues = [];
  const c = state.callout;
  if (c.mode === 'inline') {
    if (!c.inline.title.trim() && !c.inline.content.trim()) issues.push({ level: 'error', message: S('validate-callout-empty') });
    return issues;
  }
  if (!c.reusable.key.trim()) issues.push({ level: 'error', message: S('validate-callout-key-required') });
  else if (!/^[a-zA-Z][\w-]*$/.test(c.reusable.key.trim())) issues.push({ level: 'warning', message: S('validate-callout-key-format') });
  if (!c.reusable.entries.length) { issues.push({ level: 'error', message: S('validate-callout-no-entries') }); return issues; }
  c.reusable.entries.forEach((e, i) => {
    if (!e.code.trim()) issues.push({ level: 'error', message: S('validate-callout-entry-code', { n: i + 1 }) });
    if (!e.title.trim() && !e.text.trim()) issues.push({ level: 'error', message: S('validate-callout-entry-empty', { n: i + 1 }) });
  });
  const codes = c.reusable.entries.map(e => e.code.trim().toLowerCase()).filter(Boolean);
  if (codes.some((code, i) => codes.indexOf(code) !== i)) issues.push({ level: 'warning', message: S('validate-callout-duplicate-codes') });
  return issues;
}

// ── Output helpers shared by every kind ──────────────────────────────────────
function legacyCopy(text) {
  const ta = el('textarea', { style: { position: 'fixed', opacity: '0', top: '0', left: '0' } });
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

async function copyText(text, btn) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else legacyCopy(text);
  } catch (e) {
    try { legacyCopy(text); } catch (e2) { return; }
  }
  const original = btn.textContent;
  btn.textContent = S('copied');
  btn.disabled = true;
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
}

function downloadText(text, filename) {
  const blob = new Blob([text], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename }); a.click();
  URL.revokeObjectURL(url);
}

function buildCodeBlockWithActions(text, filename, hintKey) {
  const container = el('div');
  const pre = el('pre', { className: 'mce-code' });
  pre.appendChild(el('code', null, text));
  container.appendChild(pre);
  if (hintKey) container.appendChild(el('p', { className: 'mce-hint' }, S(hintKey)));
  const actions = el('div', { className: 'kb-actions' });
  actions.append(
    el('button', { className: 'kb-btn kb-btn--ghost', onClick: () => downloadText(text, filename) }, S('download-snippet')),
    el('button', { className: 'kb-btn kb-btn--primary', onClick: (e) => copyText(text, e.currentTarget) }, S('copy'))
  );
  container.appendChild(actions);
  return container;
}

// ── Preview / Output dispatch ─────────────────────────────────────────────────
function buildPreviewCard(kind) {
  const card = el('div', { className: 'kb-card' });
  card.appendChild(cardTitle(S('preview-title'), 'preview'));
  const body = el('div', { id: 'mce-preview-' + kind, className: 'mce-preview-body' });
  body.appendChild(buildPreviewBody(kind));
  card.appendChild(body);
  const noteKey = kind === 'page' ? 'preview-note-page' : kind === 'callout' ? 'preview-note-callout' : 'preview-note-items';
  card.appendChild(el('p', { className: 'mce-hint' }, S(noteKey)));
  return card;
}

function buildPreviewBody(kind) {
  if (kind === 'page') return buildPagePreviewBody();
  if (kind === 'callout') return buildCalloutPreviewBody();
  return buildItemsPreviewBody(kind);
}

function buildOutputCard(kind) {
  const card = el('div', { className: 'kb-card' });
  card.appendChild(cardTitle(S('output-title'), 'code_blocks'));
  const body = el('div', { id: 'mce-output-' + kind });
  body.appendChild(buildOutputBody(kind));
  card.appendChild(body);
  return card;
}

function buildOutputBody(kind) {
  if (kind === 'page') return buildPageOutputBody();
  if (kind === 'callout') return buildCalloutOutputBody();
  return buildItemsOutputBody(kind);
}

function mdNode(content) {
  const div = document.createElement('div');
  div.innerHTML = markdown(content || '');
  return div;
}

// ── Tab / Accordion panel ─────────────────────────────────────────────────────
function buildKindPanel(kind) {
  const wrap = el('div', { className: 'mce-panel' });
  wrap.appendChild(buildImportRow(kind));
  wrap.appendChild(buildItemsCard(kind));
  wrap.appendChild(buildPreviewCard(kind));
  wrap.appendChild(buildOutputCard(kind));
  return wrap;
}

// "Style" row (Underline/Filled) + fold-all + the repeatable item list + add.
// Builds cardRefs[kind] (count badge, empty note, items host, fold-all button,
// variant buttons) once; add/remove/move/fold/replace below patch those refs
// directly afterwards.
function buildItemsCard(kind) {
  const cfg = BLOCK_TYPES[kind];
  const items = state.items[kind];
  const card = el('div', { className: 'kb-card' });

  const titleRow = cardTitle(S('items-title'), 'cards_stack');
  const countEl = el('span', { className: 'count' }, String(items.length));
  titleRow.appendChild(countEl);
  card.appendChild(titleRow);

  const variantRow = el('div', { className: 'mce-variant-row' });
  variantRow.appendChild(el('span', { className: 'kb-label' }, S('variant-label')));
  const seg = el('div', { className: 'kb-seg', role: 'group', 'aria-label': S('variant-label') });
  const variantButtons = [];
  cfg.variants.forEach(v => {
    const btn = el('button', { type: 'button' }, S('variant-' + v.id));
    if (state.variant[kind] === v.id) btn.classList.add('is-active');
    btn.addEventListener('click', () => {
      state.variant[kind] = v.id;
      seg.querySelectorAll('button').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      refreshDerived(kind);
    });
    seg.appendChild(btn);
    variantButtons.push({ id: v.id, btn });
  });
  variantRow.appendChild(seg);
  card.appendChild(variantRow);

  const foldAllRow = el('div', { className: 'mce-items-toolbar' });
  const foldAllBtn = el('button', { type: 'button', className: 'mce-foldall-btn', onClick: () => toggleAllCollapsed(kind) });
  foldAllRow.appendChild(foldAllBtn);
  card.appendChild(foldAllRow);

  const emptyNote = noteBox('info', S('empty-items'));
  emptyNote.hidden = items.length > 0;
  card.appendChild(emptyNote);

  const itemsHost = el('div', { className: 'mce-items' });
  items.forEach(item => itemsHost.appendChild(mountItemRow(kind, cfg, item)));
  card.appendChild(itemsHost);

  const addBtn = el('button', { type: 'button', className: 'mce-add-btn', onClick: () => addItem(kind) });
  const plus = el('span', { className: 'kb-circbtn', 'aria-hidden': 'true' }, '+');
  addBtn.append(plus, el('span', null, S('add-item')));
  card.appendChild(addBtn);

  cardRefs[kind] = { countEl, emptyNote, itemsHost, foldAllBtn, variantButtons };
  updateFoldAllLabel(kind);

  return card;
}

// Mounts one item row: header (index/summary/move/remove/fold), title input,
// title-style select, a Toast UI Editor for content, and the default toggle.
// Registers everything in rowRegistry so later operations patch this exact
// row/editor instead of rebuilding it.
function mountItemRow(kind, cfg, item) {
  const row = el('div', { className: 'mce-item' + (item.collapsed ? ' is-collapsed' : '') });

  const head = el('div', { className: 'mce-item__head' });
  const indexLabel = el('span', { className: 'mce-item__index' });
  const summary = el('span', { className: 'mce-item__summary' }, item.collapsed ? item.title : '');
  head.append(indexLabel, summary);

  const move = el('div', { className: 'mce-item__move' });
  const upBtn = el('button', { type: 'button', className: 'kb-iconbtn', 'aria-label': S('move-up'),
    onClick: () => moveItem(kind, item.id, -1) }, '↑');
  const downBtn = el('button', { type: 'button', className: 'kb-iconbtn', 'aria-label': S('move-down'),
    onClick: () => moveItem(kind, item.id, 1) }, '↓');
  const rmBtn = el('button', { type: 'button', className: 'kb-circbtn kb-circbtn--rm', 'aria-label': S('remove-item'),
    onClick: () => removeItem(kind, item.id) }, '−');
  const foldBtn = el('button', { type: 'button', className: 'mce-fold-btn', 'aria-label': S('toggle-item'),
    'aria-expanded': String(!item.collapsed), onClick: () => toggleCollapsed(kind, item.id) });
  foldBtn.innerHTML = '<svg viewBox="0 0 24 24" class="mce-fold-chevron" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';
  move.append(upBtn, downBtn, rmBtn, foldBtn);
  head.appendChild(move);
  row.appendChild(head);

  const body = el('div', { className: 'mce-item__body' });

  const topRow = el('div', { className: 'mce-item__row' });
  const titleInput = el('input', { className: 'kb-input', type: 'text', placeholder: S(cfg.titlePlaceholderKey) });
  titleInput.value = item.title;
  titleInput.addEventListener('input', () => { item.title = sanitizeMarkdown(titleInput.value); refreshDerived(kind); });
  topRow.appendChild(field(S('field-title'), titleInput, 'grow'));

  const styleSelect = el('select', { className: 'kb-select' });
  TITLE_STYLE_LEVELS.forEach((lvl, i) => {
    const label = i === 0 ? S('title-style-none') : S('title-style-h', { n: i });
    const opt = el('option', { value: lvl }, label);
    if (item.titleStyle === lvl) opt.selected = true;
    styleSelect.appendChild(opt);
  });
  styleSelect.addEventListener('change', () => { item.titleStyle = styleSelect.value; refreshDerived(kind); });
  topRow.appendChild(field(S('field-title-style'), styleSelect));
  body.appendChild(topRow);

  const editorHost = makeEditorHost();
  body.appendChild(field(S('field-content'), editorHost));

  const toggleLabel = el('label', { className: 'mce-toggle' });
  const toggleInput = el('input', cfg.exclusive
    ? { type: 'radio', name: 'mce-default-' + kind }
    : { type: 'checkbox' });
  toggleInput.checked = !!item.isDefault;
  toggleInput.addEventListener('change', () => {
    if (cfg.exclusive) state.items[kind].forEach(it => { it.isDefault = false; });
    item.isDefault = cfg.exclusive ? true : toggleInput.checked;
    refreshDerived(kind);
  });
  toggleLabel.append(toggleInput, document.createTextNode(S(cfg.defaultFieldKey)));
  body.appendChild(toggleLabel);

  row.appendChild(body);

  const editor = mountEditor(editorHost, item.content, '260px', 'ph-content', (md) => { item.content = md; refreshDerived(kind); });

  rowRegistry[kind].set(item.id, { root: row, editor, editorHost, indexLabel, summary, upBtn, downBtn, foldBtn });
  return row;
}

function addItem(kind) {
  const cfg = BLOCK_TYPES[kind];
  const item = makeBlankItem();
  state.items[kind].push(item);
  cardRefs[kind].itemsHost.appendChild(mountItemRow(kind, cfg, item));
  syncRowChrome(kind);
  refreshDerived(kind);
}

function removeItem(kind, id) {
  const entry = rowRegistry[kind].get(id);
  if (!entry) return;
  try { entry.editor.destroy(); } catch (e) { /* see the window "error" listener above */ }
  entry.root.remove();
  rowRegistry[kind].delete(id);
  state.items[kind] = state.items[kind].filter(it => it.id !== id);
  syncRowChrome(kind);
  refreshDerived(kind);
}

function moveItem(kind, id, dir) {
  const arr = state.items[kind];
  const idx = arr.findIndex(it => it.id === id);
  const j = idx + dir;
  if (idx < 0 || j < 0 || j >= arr.length) return;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  // Re-append every row in the new state order — appendChild on an
  // already-attached node MOVES it, so editor instances are relocated, never
  // destroyed/recreated.
  arr.forEach(it => cardRefs[kind].itemsHost.appendChild(rowRegistry[kind].get(it.id).root));
  syncRowChrome(kind);
  refreshDerived(kind);
}

// Updates index labels, move-button boundary state, the count badge, and
// empty-state visibility. Never touches an editor instance.
function syncRowChrome(kind) {
  const items = state.items[kind];
  cardRefs[kind].countEl.textContent = String(items.length);
  cardRefs[kind].emptyNote.hidden = items.length > 0;
  items.forEach((it, i) => {
    const entry = rowRegistry[kind].get(it.id);
    entry.indexLabel.textContent = S('item-label', { n: i + 1 });
    entry.upBtn.disabled = i === 0;
    entry.downBtn.disabled = i === items.length - 1;
  });
}

function toggleCollapsed(kind, id) {
  const item = state.items[kind].find(it => it.id === id);
  const entry = rowRegistry[kind].get(id);
  item.collapsed = !item.collapsed;
  entry.root.classList.toggle('is-collapsed', item.collapsed);
  entry.foldBtn.setAttribute('aria-expanded', String(!item.collapsed));
  entry.summary.textContent = item.collapsed ? item.title : '';
  updateFoldAllLabel(kind);
  persistDraft();
}

function toggleAllCollapsed(kind) {
  const items = state.items[kind];
  if (!items.length) return;
  const nextCollapsed = !items.every(it => it.collapsed);
  items.forEach(it => {
    it.collapsed = nextCollapsed;
    const entry = rowRegistry[kind].get(it.id);
    entry.root.classList.toggle('is-collapsed', nextCollapsed);
    entry.foldBtn.setAttribute('aria-expanded', String(!nextCollapsed));
    entry.summary.textContent = nextCollapsed ? it.title : '';
  });
  updateFoldAllLabel(kind);
  persistDraft();
}

function updateFoldAllLabel(kind) {
  const items = state.items[kind];
  const btn = cardRefs[kind].foldAllBtn;
  if (!btn) return;
  const allCollapsed = items.length > 0 && items.every(it => it.collapsed);
  btn.textContent = allCollapsed ? S('expand-all') : S('collapse-all');
}

function buildItemsPreviewBody(kind) {
  const items = state.items[kind];
  if (!items.length) return el('p', { className: 'mce-hint' }, S('empty-items'));

  if (kind === 'tab') {
    let defaultIndex = items.findIndex(it => it.isDefault);
    if (defaultIndex < 0) defaultIndex = 0;   // matches mdcms's own fallback rule
    return makeTabs(items.map(it => ({ label: it.title, content: mdNode(it.content) })), { defaultIndex });
  }

  // Accordion: deliberately NOT the shared makeAccordion() helper. That helper
  // enforces single-open-at-a-time (closing one item when another opens),
  // which is a valid generic accordion pattern but does not match MD-CMS's
  // own accordion — there, any number of items may be open simultaneously
  // (see docs/reference-pages.md in kbenestad/mdcms). Reproducing that here
  // means reusing the shared kb-accordion__* classes directly with independent
  // per-item toggle state instead of the shared exclusive-open behaviour.
  const wrap = el('div', { className: 'kb-accordion' });
  items.forEach(it => {
    const triggerId = uid(), panelId = uid();
    let open = !!it.isDefault;

    const trigger = el('button', { type: 'button', className: 'kb-accordion__trigger', id: triggerId, 'aria-expanded': String(open), 'aria-controls': panelId });
    trigger.appendChild(document.createTextNode(it.title));
    const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    chevron.setAttribute('viewBox', '0 0 24 24'); chevron.setAttribute('class', 'kb-accordion__chevron');
    chevron.setAttribute('fill', 'none'); chevron.setAttribute('stroke', 'currentColor'); chevron.setAttribute('stroke-width', '2'); chevron.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('d', 'M6 9l6 6 6-6');
    chevron.appendChild(path);
    trigger.appendChild(chevron);

    const panel = el('div', { className: 'kb-accordion__panel' + (open ? ' is-open' : ''), id: panelId, 'aria-labelledby': triggerId });
    panel.appendChild(mdNode(it.content));

    trigger.addEventListener('click', () => {
      open = !open;
      trigger.setAttribute('aria-expanded', String(open));
      panel.classList.toggle('is-open', open);
    });

    const itemEl = el('div', { className: 'kb-accordion__item' });
    itemEl.append(trigger, panel);
    wrap.appendChild(itemEl);
  });
  return wrap;
}

function buildItemsOutputBody(kind) {
  const items = state.items[kind];
  const container = el('div');
  if (!items.length) { container.appendChild(noteBox('info', S('output-empty'))); return container; }
  const incomplete = items.some(it => !it.title.trim() || !it.content.trim());
  if (incomplete) container.appendChild(noteBox('warning', S('warn-incomplete')));
  const filename = 'mdcms-' + currentVariantDef(kind).tagName + '.md';
  container.appendChild(buildCodeBlockWithActions(buildSnippet(kind), filename, 'output-hint'));
  return container;
}

// ── Page panel ─────────────────────────────────────────────────────────────
function buildPagePanel() {
  const wrap = el('div', { className: 'mce-panel' });
  wrap.appendChild(buildImportRow('page'));
  wrap.appendChild(buildPageContentCard());
  wrap.appendChild(buildPreviewCard('page'));
  wrap.appendChild(buildOutputCard('page'));
  return wrap;
}

function buildPageContentCard() {
  const card = el('div', { className: 'kb-card' });
  card.appendChild(cardTitle(S('page-content-title'), 'article'));
  const editorHost = makeEditorHost();
  card.appendChild(editorHost);
  const editor = mountEditor(editorHost, state.page.content, '420px', 'ph-page-content', (md) => {
    state.page.content = md;
    refreshDerived('page');
  });
  rowRegistry.page.set('page', { root: editorHost, editor, editorHost });
  return card;
}

function buildPagePreviewBody() {
  const content = state.page.content || '';
  if (!content.trim()) return el('p', { className: 'mce-hint' }, S('empty-page'));
  return mdNode(content);
}

function buildPageOutputBody() {
  const content = state.page.content || '';
  const container = el('div');
  if (!content.trim()) { container.appendChild(noteBox('info', S('output-empty-page'))); return container; }
  container.appendChild(buildCodeBlockWithActions(content, 'page.md', 'output-hint-page'));
  return container;
}

// ── Callout panel ─────────────────────────────────────────────────────────────
function buildCalloutPanel() {
  const wrap = el('div', { className: 'mce-panel' });
  wrap.appendChild(buildImportRow('callout'));
  wrap.appendChild(buildCalloutCard());
  wrap.appendChild(buildPreviewCard('callout'));
  wrap.appendChild(buildOutputCard('callout'));
  return wrap;
}

function buildCalloutCard() {
  const card = el('div', { className: 'kb-card' });
  card.appendChild(cardTitle(S('callout-title'), 'cards_stack'));

  const modeRow = el('div', { className: 'mce-variant-row' });
  modeRow.appendChild(el('span', { className: 'kb-label' }, S('callout-mode-label')));
  const modeSeg = el('div', { className: 'kb-seg', role: 'group', 'aria-label': S('callout-mode-label') });
  const modeButtons = [];
  [['inline', 'callout-mode-inline', 'iframe'], ['reusable', 'callout-mode-reusable', 'cycle']].forEach(([modeId, key, iconName]) => {
    const btn = el('button', { type: 'button', className: 'mce-mode-btn' });
    btn.append(iconEl(iconName), document.createTextNode(S(key)));
    if (state.callout.mode === modeId) btn.classList.add('is-active');
    btn.addEventListener('click', () => {
      if (state.callout.mode === modeId) return;
      state.callout.mode = modeId;
      refreshCalloutModeBody();
      refreshDerived('callout');
    });
    modeSeg.appendChild(btn);
    modeButtons.push({ id: modeId, btn });
  });
  modeRow.appendChild(modeSeg);
  card.appendChild(modeRow);

  const modeBody = el('div', { id: 'mce-callout-mode-body' });
  card.appendChild(modeBody);
  cardRefs.callout = { modeBody, modeButtons };
  mountCalloutModeBody();

  return card;
}

// Switching mode (by click OR by a successful import setting state.callout.mode
// directly) rebuilds just this section — see the file-header lifecycle note on
// why that's fine for a structural change. Always resyncs the mode buttons'
// active state too, since programmatic mode changes (import) don't go through
// the click handler that would otherwise do it.
function refreshCalloutModeBody() {
  rowRegistry.calloutInline.forEach(entry => { try { entry.editor.destroy(); } catch (e) {} });
  rowRegistry.calloutInline.clear();
  rowRegistry.calloutEntry.forEach(entry => { try { entry.editor.destroy(); } catch (e) {} });
  rowRegistry.calloutEntry.clear();
  cardRefs.callout.modeBody.innerHTML = '';
  mountCalloutModeBody();
  cardRefs.callout.modeButtons.forEach(({ id, btn }) => btn.classList.toggle('is-active', id === state.callout.mode));
}

function mountCalloutModeBody() {
  const host = cardRefs.callout.modeBody;
  host.appendChild(state.callout.mode === 'inline' ? buildCalloutInlineFields() : buildCalloutReusableFields());
}

function buildCalloutTypeSelect(getType, setType) {
  const typeSelect = el('select', { className: 'kb-select' });
  CALLOUT_TYPES.forEach(t => {
    const opt = el('option', { value: t }, S('callout-type-' + t));
    if (getType() === t) opt.selected = true;
    typeSelect.appendChild(opt);
  });
  typeSelect.addEventListener('change', () => { setType(typeSelect.value); refreshDerived('callout'); });
  return typeSelect;
}

function buildCalloutInlineFields() {
  const wrap = el('div');
  const c = state.callout.inline;

  const topRow = el('div', { className: 'mce-item__row' });
  topRow.appendChild(field(S('callout-type-label'), buildCalloutTypeSelect(() => c.type, (v) => { c.type = v; })));

  const titleInput = el('input', { className: 'kb-input', type: 'text', placeholder: S('ph-callout-title') });
  titleInput.value = c.title;
  titleInput.addEventListener('input', () => { c.title = sanitizeMarkdown(titleInput.value); refreshDerived('callout'); });
  topRow.appendChild(field(S('callout-field-title'), titleInput, 'grow'));
  wrap.appendChild(topRow);

  const iconInput = el('input', { className: 'kb-input', type: 'text', placeholder: S('ph-callout-icon') });
  iconInput.value = c.icon;
  iconInput.addEventListener('input', () => { c.icon = sanitizeMarkdown(iconInput.value); refreshDerived('callout'); });
  wrap.appendChild(field(S('callout-field-icon'), iconInput));

  const editorHost = makeEditorHost();
  wrap.appendChild(field(S('callout-field-content'), editorHost));
  const editor = mountEditor(editorHost, c.content, '220px', 'ph-content', (md) => { c.content = md; refreshDerived('callout'); });
  rowRegistry.calloutInline.set('inline', { root: editorHost, editor, editorHost });

  return wrap;
}

function buildCalloutReusableFields() {
  const wrap = el('div');
  const r = state.callout.reusable;

  const topRow = el('div', { className: 'mce-item__row' });
  topRow.appendChild(field(S('callout-type-label'), buildCalloutTypeSelect(() => r.type, (v) => { r.type = v; })));

  const keyInput = el('input', { className: 'kb-input', type: 'text', placeholder: S('ph-callout-key') });
  keyInput.value = r.key;
  keyInput.addEventListener('input', () => { r.key = sanitizeMarkdown(keyInput.value); refreshDerived('callout'); });
  topRow.appendChild(field(S('callout-field-key'), keyInput, 'grow'));
  wrap.appendChild(topRow);

  wrap.appendChild(el('div', { className: 'kb-label mce-entries-title' }, S('callout-entries-title')));

  const emptyNote = noteBox('info', S('callout-empty-entries'));
  emptyNote.hidden = r.entries.length > 0;
  wrap.appendChild(emptyNote);

  const entriesHost = el('div', { className: 'mce-items' });
  r.entries.forEach(entry => entriesHost.appendChild(mountCalloutEntryRow(entry)));
  wrap.appendChild(entriesHost);

  const addBtn = el('button', { type: 'button', className: 'mce-add-btn', onClick: () => addCalloutEntry() });
  addBtn.append(el('span', { className: 'kb-circbtn', 'aria-hidden': 'true' }, '+'), el('span', null, S('callout-add-entry')));
  wrap.appendChild(addBtn);

  cardRefs.calloutEntries = { emptyNote, entriesHost };
  return wrap;
}

function mountCalloutEntryRow(entry) {
  const row = el('div', { className: 'mce-item' });
  const head = el('div', { className: 'mce-item__head' });
  const indexLabel = el('span', { className: 'mce-item__index' });
  head.appendChild(indexLabel);
  const move = el('div', { className: 'mce-item__move' });
  const upBtn = el('button', { type: 'button', className: 'kb-iconbtn', 'aria-label': S('move-up'), onClick: () => moveCalloutEntry(entry.id, -1) }, '↑');
  const downBtn = el('button', { type: 'button', className: 'kb-iconbtn', 'aria-label': S('move-down'), onClick: () => moveCalloutEntry(entry.id, 1) }, '↓');
  const rmBtn = el('button', { type: 'button', className: 'kb-circbtn kb-circbtn--rm', 'aria-label': S('remove-item'), onClick: () => removeCalloutEntry(entry.id) }, '−');
  move.append(upBtn, downBtn, rmBtn);
  head.appendChild(move);
  row.appendChild(head);

  const topRow = el('div', { className: 'mce-item__row' });
  const codeInput = el('input', { className: 'kb-input', type: 'text', placeholder: S('ph-callout-code') });
  codeInput.value = entry.code;
  codeInput.addEventListener('input', () => { entry.code = sanitizeMarkdown(codeInput.value); refreshDerived('callout'); });
  topRow.appendChild(field(S('callout-field-code'), codeInput));

  const titleInput = el('input', { className: 'kb-input', type: 'text', placeholder: S('ph-callout-title') });
  titleInput.value = entry.title;
  titleInput.addEventListener('input', () => { entry.title = sanitizeMarkdown(titleInput.value); refreshDerived('callout'); });
  topRow.appendChild(field(S('callout-field-entry-title'), titleInput, 'grow'));
  row.appendChild(topRow);

  const editorHost = makeEditorHost();
  row.appendChild(field(S('callout-field-entry-text'), editorHost));
  const editor = mountEditor(editorHost, entry.text, '180px', 'ph-content', (md) => { entry.text = md; refreshDerived('callout'); });

  rowRegistry.calloutEntry.set(entry.id, { root: row, editor, editorHost, indexLabel, upBtn, downBtn });
  return row;
}

function addCalloutEntry() {
  const entry = makeBlankCalloutEntry();
  state.callout.reusable.entries.push(entry);
  cardRefs.calloutEntries.entriesHost.appendChild(mountCalloutEntryRow(entry));
  syncCalloutEntryChrome();
  refreshDerived('callout');
}

function removeCalloutEntry(id) {
  const entry = rowRegistry.calloutEntry.get(id);
  if (!entry) return;
  try { entry.editor.destroy(); } catch (e) {}
  entry.root.remove();
  rowRegistry.calloutEntry.delete(id);
  state.callout.reusable.entries = state.callout.reusable.entries.filter(e => e.id !== id);
  syncCalloutEntryChrome();
  refreshDerived('callout');
}

function moveCalloutEntry(id, dir) {
  const arr = state.callout.reusable.entries;
  const idx = arr.findIndex(e => e.id === id);
  const j = idx + dir;
  if (idx < 0 || j < 0 || j >= arr.length) return;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  arr.forEach(e => cardRefs.calloutEntries.entriesHost.appendChild(rowRegistry.calloutEntry.get(e.id).root));
  syncCalloutEntryChrome();
  refreshDerived('callout');
}

function syncCalloutEntryChrome() {
  const entries = state.callout.reusable.entries;
  cardRefs.calloutEntries.emptyNote.hidden = entries.length > 0;
  entries.forEach((e, i) => {
    const entry = rowRegistry.calloutEntry.get(e.id);
    entry.indexLabel.textContent = S('callout-entry-label', { n: i + 1 });
    entry.upBtn.disabled = i === 0;
    entry.downBtn.disabled = i === entries.length - 1;
  });
}

function calloutPreviewBox(type, title, content) {
  const icons = { info: KB_ICON.info, warning: KB_ICON.warn, success: MCE_ICON.success, error: MCE_ICON.error };
  const box = el('div', { className: 'kb-note kb-note--' + type });
  const iconSpan = el('span'); iconSpan.innerHTML = icons[type] || KB_ICON.info;
  const body = el('div');
  if (title.trim()) body.appendChild(el('b', null, title));
  body.appendChild(mdNode(content));
  box.append(iconSpan, body);
  return box;
}

function buildCalloutPreviewBody() {
  const c = state.callout;
  if (c.mode === 'inline') {
    if (!c.inline.title.trim() && !c.inline.content.trim()) return el('p', { className: 'mce-hint' }, S('empty-items'));
    return calloutPreviewBox(c.inline.type, c.inline.title, c.inline.content);
  }
  const first = c.reusable.entries[0];
  if (!first || (!first.title.trim() && !first.text.trim())) return el('p', { className: 'mce-hint' }, S('empty-items'));
  return calloutPreviewBox(c.reusable.type, first.title, first.text);
}

function buildCalloutOutputBody() {
  const c = state.callout;
  const container = el('div');
  if (c.mode === 'inline') {
    if (!c.inline.title.trim() && !c.inline.content.trim()) { container.appendChild(noteBox('info', S('output-empty'))); return container; }
    container.appendChild(buildCodeBlockWithActions(buildCalloutInlineSnippet(), 'mdcms-callout-' + c.inline.type + '.md', 'output-hint'));
    return container;
  }
  if (!c.reusable.key.trim() || !c.reusable.entries.length) { container.appendChild(noteBox('info', S('output-empty'))); return container; }
  container.appendChild(el('div', { className: 'kb-label mce-output-subhead' }, S('output-page-snippet')));
  container.appendChild(buildCodeBlockWithActions(buildCalloutReusableFenceSnippet(), 'mdcms-callout-' + c.reusable.type + '.md', 'output-hint'));
  container.appendChild(el('div', { className: 'kb-label mce-output-subhead' }, S('callout-config-output-title')));
  container.appendChild(buildCodeBlockWithActions(buildCalloutConfigYaml(), (c.reusable.key.trim() || 'message-key') + '.callout.yml', 'callout-config-output-hint'));
  return container;
}

// Footer: kBenestad mark · © · repo link · About  —  version block (right).
function buildFooter() {
  const sep = () => el('span', { className: 'sep' }, '·');
  const footer = el('footer', { className: 'kb-footer' });
  const mark = el('span', { className: 'kb-mark' }); mark.innerHTML = KB_FOOTER_MARK_SVG + 'kBenestad';
  footer.append(
    mark,
    sep(), el('span', null, '© 2026 Kristian Benestad'),
    sep(), el('a', { href: 'https://github.com/kbenestad/bizdocs', target: '_blank', rel: 'noopener' }, 'kbenestad/bizdocs'),
    sep(), el('button', { type: 'button', onClick: showAboutModal }, CFG['about-title'] || 'About'),
    el('div', { className: 'spacer' }),
    buildVersionBlock()
  );
  return footer;
}

// Right-aligned version block: vX.Y.Z • {commit} (links to the shipping PR)
// on one line, the "last updated" date below.
function buildVersionBlock() {
  const wrap = el('div', { className: 'mce-version' });
  wrap.append(
    el('a', { href: APP_VERSION.prUrl, target: '_blank', rel: 'noopener' },
      `v${APP_VERSION.version} • ${APP_VERSION.commit}`),
    el('span', null, APP_VERSION.date)
  );
  return wrap;
}

// ── Boot ───────────────────────────────────────────────────────────────────
try {
  const [cfg] = await Promise.all([loadYamlConfig(), loadIcons(), loadHelpConfig()]);
  CFG = cfg;                       // fetch + parse config.yml (shared helper)
  assertValidConfig(CFG);         // guard: catch HTML-instead-of-YAML (see above)
  normaliseConfig();
  applyAccent(CFG);               // apply config accent-colour to --accent
  initFontScale();                // restore persisted text size
  lang = localStorage.getItem('mdcmseditor-lang') || CFG['default-code'] || 'en';
  applyLang(lang);
  const draft = loadDraft();
  state.variant = draft.variant;
  state.items = draft.items;
  state.page = draft.page;
  state.callout = draft.callout;
  render();
} catch (e) {
  document.getElementById('app').innerHTML =
    `<div class="kb-wrap"><div class="kb-note kb-note--error"><span>⚠</span>` +
    `<div><b>Failed to load config.yml</b><br>${e.message}</div></div></div>`;
}
})();
</script>
</body>
</html>
